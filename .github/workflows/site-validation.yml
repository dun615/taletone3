name: Site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        run: node scripts/build.mjs
      - name: Validate production files
        run: node .github/scripts/validate-site.mjs
      - name: Unit tests
        run: node --test "tests/*.test.mjs"
      - name: Validate runtime performance budgets
        env:
          SKIP_BRIDGES: '1'
        run: node .github/scripts/validate-runtime-performance.mjs

  bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        run: node scripts/build.mjs
      - name: Validate bridge playback and scroll isolation
        env:
          BRIDGE_ONLY: '1'
        run: node .github/scripts/validate-runtime-performance.mjs
