name: Site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        run: node scripts/build.mjs
      - name: Validate production files
        run: node .github/scripts/validate-site.mjs
      - name: Unit tests
        run: node --test "tests/*.test.mjs"
      - name: Validate the site in a browser (every route, the whole story, a record, the inquiry)
        run: node .github/scripts/validate-runtime-performance.mjs

