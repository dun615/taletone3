<h1>Story Types | TALETONE MUSIC — Music for Story-Driven IP</h1>
<p><strong>Where your story becomes music.</strong></p>
<p>How TALETONE MUSIC shapes music for subculture games, VTubers and artists, and animation, webtoon, and web novel IP, with selected projects such as Drawing Summer and Heart Score.</p>
<section>
<h2>Stories we work with</h2>
<p>For stories with worlds of their own, we write the songs.</p>
<p>A quest inside a game, a virtual artist&#39;s first stage, a single scene of animation. We read the hearts and characters inside first, then go looking for the sound that fits.</p>
</section>
<article>
<h3>GAME IP · Drawing Summer</h3>
<p>The summer getaway of the Cunning Hares, painted in a band sound as bright as sunlight.</p>
</article>
<article>
<h3>VTUBER / ARTIST · Heart Score</h3>
<p>Four girls of different colors, becoming one band. That short, dazzling youth, held in a single song.</p>
</article>
