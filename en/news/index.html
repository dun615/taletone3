<h1>News | TALETONE MUSIC — News and Updates</h1>
<p><strong>Where your story becomes music.</strong></p>
<p>The latest news and project updates from TALETONE MUSIC, including new releases such as Bubble Sweet and Heart Score.</p>
<article>
<h2>2026.07.11 · <a href="/en/news/bubble-sweet-release/">DOLONGCHA 2nd Single &#39;Bubble Sweet&#39; Released</a></h2>
<p>Virtual artist DOLONGCHA&#39;s second original single, &#39;Bubble Sweet,&#39; with music production by TALETONE, has been released.</p>
<p>On a sunlit summer day, a small and sweet story begins inside a clear cup.</p>
<p>Inspired by bubble tea, popping boba, and a variety of cafe drinks, &#39;Bubble Sweet&#39; pairs a melody that flows like a journey through a colorful drink with the effervescent thrill of excitement, brought to life by DOLONGCHA&#39;s lovely, pure voice.</p>
<p>TALETONE was involved across the full production of the song, from overall music production to lyric writing, composition, arrangement, synthesizer, drum programming, and bass guitar performance.</p>
<p>Set against a buoyant rhythm and an addictive hook, the song captures the moment when a sip of sweetness turns into a small happiness. We hoped the tender feelings rising like bubbles would follow the music all the way to a clear summer sky.</p>
<p>We are sincerely grateful to have joined this precious and delightful story.<br>We hope &#39;Bubble Sweet&#39; stays with you as a sweet, magical moment throughout your summer.</p>
<p>A tale becomes a tone.<br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
</article>
<article>
<h2>2026.07.11 · <a href="/en/news/taletone-begins/">TALETONE Begins Its First Story</a></h2>
<p>At last, TALETONE has taken its first step.</p>
<p>It took longer than we ever imagined to gather the stories, the music, and the world we had dreamed of into a single name. It wasn&#39;t always an easy journey, but thanks to everyone who believed in us and walked alongside us, we&#39;re finally able to share this beginning.</p>
<p>TALETONE is more than a place where music is made.<br>We hope to become a team where stories become sound, and that sound finds its way into someone&#39;s world.</p>
<p>To our members, everyone who lent their hands to this journey, and everyone who has continued to support us—thank you from the bottom of our hearts.</p>
<p>This may be a small beginning, but we&#39;ll continue writing new stories through music, one page at a time.</p>
<p>Thank you for being part of TALETONE&#39;s story.</p>
<p>A tale becomes a tone.<br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
</article>
<article>
<h2>2026.06.11 · <a href="/en/news/heart-score-release/">STELLIVE Universe &#39;Heart Score&#39; Released</a></h2>
<p>The original group single &#39;Heart Score&#39; by STELLIVE Universe, with music production by TALETONE, has officially been released.</p>
<p>&#39;Heart Score&#39; is performed by the four artists of STELLIVE&#39;s 2nd Generation unit &#39;Universe&#39;—Shirayuki Hina, Neneko Mashiro, Akane Lize, and Arahashi Tabi. Under the theme of youth, the song captures the moments when time and memories are written into music.</p>
<p>TALETONE participated throughout the music production, including composition, arrangement, instrumental performance, vocal guide production, and vocal editing.</p>
<p>Built upon bright melodies and a rock band sound, we poured our hearts into creating a song where those clumsy yet radiant moments could remain like notes on a musical score.</p>
<p>We are sincerely grateful to have been part of such a meaningful project.</p>
<p>We hope &#39;Heart Score&#39; will remain in the hearts of many listeners for a long time.</p>
<p>A tale becomes a tone.<br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
