<h1>Works | TALETONE MUSIC — Portfolio</h1>
<p><strong>Where your story becomes music.</strong></p>
<p>The public portfolio of TALETONE MUSIC: original songs, OSTs, character songs, and BGM, including Heart Score, Drawing Summer, and Love Dopamine.</p>
<section>
<h2>Works</h2>
<ul>
<li><strong><a href="/en/works/bubble-sweet/">Bubble Sweet</a></strong> — DOLONGCHA · DOLONGCHA 2nd Single (2026.07.11)<br>A story that captures the sweet excitement of bubbles popping beneath the midsummer sun in one refreshingly cool drink.</li>
<li><strong><a href="/en/works/heart-score/">Heart Score</a></strong> — STELLIVE Universe · STELLIVE &#39;Universe&#39; 2nd Single (2026.06.11)<br>A story of four girls, each with her own color, coming together as a band to write a story of their own.</li>
<li><strong><a href="/en/works/love-novel/">Love Novel</a></strong> — Arune · &#39;Arune&#39; 1st Single (2026.03.08)<br>A story of two people who move through sorrow and longing, then begin to love again.</li>
<li><strong><a href="/en/works/fallen-leaves/">Fallen Leaves</a></strong> — Kurogami Sasha · V-llage &#39;Kurogami Sasha&#39; 1st Single (2025.12.23)<br>The story of a girl who begins a game of Russian roulette to put an end to &#39;the person she was then.&#39;</li>
<li><strong><a href="/en/works/gangchi-island-op/">Gangchi Island (OP)</a></strong> — SEION · Animation &#39;Gangchi Island&#39; 1st OP (Produced by Jang Junho) (2025.09.10)<br>A story of friends growing their dreams and friendships on Gangchi Island.</li>
<li><strong><a href="/en/works/love-dopamine/">Love Dopamine</a></strong> — Haebom · &#39;Haebom&#39; 3rd Single (2025.08.30)<br>Haebom&#39;s story, where the desire to say &#39;I like you&#39; bursts like a rush of dopamine.</li>
<li><strong><a href="/en/works/the-run-catch/">The Run Catch</a></strong> — DOLONGCHA · DOLONGCHA 1st Single (2025.08.23)<br>The story of a girl(?) who runs straight toward the person she likes without hesitation.</li>
<li><strong><a href="/en/works/drawing-summer/">Drawing Summer</a></strong> — Zenless Zone Zero · Zenless Zone Zero HoYoFair Album &quot;Random Play&quot; Anniversary (2025.07.06)<br>The story of the Cunning Hares setting off on a summer vacation.</li>
<li><strong><a href="/en/works/floris-waltz/">Floris Waltz</a></strong> — Floweress Loe (V-llage) · V-llage &#39;Floris Loe&#39; 1st Single (2025.03.21)<br>A work that unfolds emotions of anxiety and obsession through narrative-driven music.</li>
<li><strong><a href="/en/works/early-spring/">Early Spring [ALBUM]</a></strong> — Dear my heroes · Dear my heroes 1st EP (2025.03.06)<br>A story of the hearts left behind after death and farewell, moving through grief and returning to life within the cycles of time and the seasons.</li>
<li><strong><a href="/en/works/pompous/">Pompous</a></strong> — Beldir (V-LUP) · V-LUP &#39;Beldir&#39; 1st Single (2025.01.27)<br>A story that shouts boldly toward vanity and the desire for approval on social media.</li>
<li><strong><a href="/en/works/new-year-syndrome/">NEW YEAR SYNDROME</a></strong> — MAIMATSU · MAIMATSU 2nd Single (2024.12.27)<br>A story of four girls making New Year&#39;s plans that will likely fail again.</li>
<li><strong><a href="/en/works/wrap-up/">Wrap Up</a></strong> — RoA · RoA 4th Single (2024.11.22)<br>A story of a girl neatly wrapping up a finished relationship and moving forward.</li>
<li><strong><a href="/en/works/silverline/">SilverLine [ALBUM]</a></strong> — V-llage · SilverLine [ALBUM] (2024.07.16)<br>A story of seven girls bringing light back to a city hidden by dark clouds.</li>
<li><strong><a href="/en/works/my-village/">My Village</a></strong> — V-llage · Theme Song for Game &#39;Welcome to V-llage!&#39; (2024.07.02)<br>A warm story created together by everyone gathered in the small village of V-llage.</li>
<li><strong><a href="/en/works/kanism-holic/">Kanism☆Holic</a></strong> — Tigris Kanin · V-llage &#39;Tigris Kanin&#39; 1st Single (2024.04.06)<br>A story of everyone gathered at the Tigris tavern, laughing, talking, and making memories together.</li>
<li><strong><a href="/en/works/backstage/">BACKSTAGE</a></strong> — Mafhills · Mafhills 1st Single (2024.03.03)<br>A story of artists waiting with excitement to meet fans before a live show.</li>
<li><strong><a href="/en/works/watercolour/">Watercolour</a></strong> — soraniwa · soraniwa Project 1st Single (2024.02.22)<br>A story of a girl collecting fragments of forgotten memories to find a lost friend.</li>
<li><strong><a href="/en/works/star-to-star/">STAR to STAR</a></strong> — Shabel Tonya · Honkai: Star Rail &#39;2023 Multiverse Vistas&#39; Popularity &amp; Excellence Award Winner (2023.06.30)<br>A story of continuing a pioneering journey against fate while connecting star to star.</li>
<li><strong><a href="/en/works/night-sky/">Night Sky</a></strong> — Bed Taker · Bed Taker 1st Single (2021.11.19)<br>A story of telling the night sky about pain that could not be shared with anyone.</li>
<li><strong><a href="/en/works/sailing-stars/">Sailing StarS!</a></strong> — N4ML · Eight utaite chorus project (2019.10.06)<br>A story of holding each other&#39;s hands and moving toward a shining tomorrow.</li>
</ul>
