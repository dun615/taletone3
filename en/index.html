<h1>TALETONE MUSIC — Story-Based IP Music Production</h1>
<p><strong>Where your story becomes music.</strong></p>
<p>TALETONE MUSIC is a story-based music production team that plans and produces original songs, OSTs, character songs, and BGM for IPs with living worlds: subculture games, VTubers, and animation.</p>
<section>
<h2>Stories we work with</h2>
<p>Story-based music production for IPs with living worlds.</p>
<p>From games and virtual artists to animation, we read each story&#39;s emotion and character to shape its musical direction.</p>
</section>
