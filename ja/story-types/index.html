<h1>Story Types | TALETONE MUSIC — 物語のあるIPのための音楽</h1>
<p><strong>あなたの物語が、音楽になる場所。</strong></p>
<p>サブカルチャーゲーム、VTuber・アーティスト、アニメ・Webtoon・Web小説IPのための音楽制作の方向性と、「Drawing Summer」「Heart Score」などの代表プロジェクトを紹介します。</p>
<section>
<h2>私たちが向き合う物語</h2>
<p>世界観のあるIPを音楽へ広げるストーリーベースの音楽プロダクション</p>
<p>ゲームからVTuber、アニメーションまで。物語の感情とキャラクターを読み解き、音楽の方向性を設計します。</p>
</section>
<article>
<h3>GAME IP · Drawing Summer</h3>
<p>夏のバカンスの情景とキャラクター性を、爽やかなバンドサウンドへ広げたゲームIPアルバムプロジェクトです。</p>
</article>
<article>
<h3>VTUBER / ARTIST · Heart Score</h3>
<p>異なる個性を持つ4人の少女が一つのバンドになる青春の物語を、作曲と編曲で一曲に描きました。</p>
</article>
