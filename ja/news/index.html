<h1>News | TALETONE MUSIC — ニュースとお知らせ</h1>
<p><strong>あなたの物語が、音楽になる場所。</strong></p>
<p>TALETONE MUSICの最新ニュースとプロジェクトのお知らせ。Bubble Sweet、Heart Scoreなどのリリース情報をお届けします。</p>
<article>
<h2>2026.07.11 · <a href="/ja/news/bubble-sweet-release/">DOLONGCHA 2nd Single『Bubble Sweet』リリース</a></h2>
<p>TALETONEが音楽制作で参加した、バーチャルアーティストDOLONGCHAの2nd Original Single『Bubble Sweet』がリリースされました。</p>
<p>陽射しがきらめくある夏の日、透明なカップの中で、小さく甘い物語が始まります。</p>
<p>『Bubble Sweet』は、バブルティーやポッピングボバをはじめ、さまざまなカフェドリンクからインスピレーションを受けた楽曲です。カラフルなドリンクの中を旅するように流れるメロディーと、泡のように弾けるときめきを、DOLONGCHAならではの愛らしくピュアな歌声で描きました。</p>
<p>TALETONEは、本作の音楽総合プロデュースをはじめ、作詞・作曲・編曲・シンセサイザー・ドラムプログラミング・ベースギター演奏など、音楽制作全般に参加しました。</p>
<p>弾むリズムと中毒性のあるフックに、一口の甘さが小さな幸せへと変わる瞬間を込めました。バブルのようにふんわりと膨らんだ想いが、音楽とともに爽やかな夏空へ届くことを願っています。</p>
<p>大切で愛らしい物語にご一緒できたことを、心より感謝申し上げます。<br>『Bubble Sweet』が、皆さまの夏にも甘い魔法のようなひとときとして、長く残りますように。</p>
<p>A tale becomes a tone.<br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
</article>
<article>
<h2>2026.07.11 · <a href="/ja/news/taletone-begins/">TALETONE、最初の物語を始めます。</a></h2>
<p>ついに、TALETONEが最初の一歩を踏み出しました。</p>
<p>長いあいだ胸の中で温めてきた物語と音楽、そして私たちが描きたかった世界を、一つの名前のもとに形にするまでには、想像以上の時間がかかりました。決して平坦な道ではありませんでしたが、ともに考え、ともに歩んでくださった皆さまのおかげで、この始まりをお届けできることを心から嬉しく思います。</p>
<p>TALETONEは、ただ音楽をつくる場所ではありません。<br>物語が音になり、その音が誰かの世界へ届いていく――そんなチームを目指しています。</p>
<p>支えてくださったメンバーの皆さま、制作に力を貸してくださった皆さま、そしていつも応援してくださるすべての皆さまへ、心より感謝申し上げます。</p>
<p>まだ小さな一歩ではありますが、これからも音楽と物語を一ページずつ丁寧に紡いでまいります。</p>
<p>これからのTALETONEも、どうぞよろしくお願いいたします。</p>
<p>A tale becomes a tone.<br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
</article>
<article>
<h2>2026.06.11 · <a href="/ja/news/heart-score-release/">STELLIVE Universe『Heart Score』リリース</a></h2>
<p>TALETONEが音楽制作で参加した、STELLIVE Universeのオリジナルグループシングル『Heart Score』がリリースされました。</p>
<p>『Heart Score』は、STELLIVE第2期生ユニット『Universe』に所属する白雪ひな、ねねこマシロ、茜リゼ、アラハシ・タビの4人が歌う楽曲です。「青春」をテーマに、時間と思い出が歌の中へ刻まれていく瞬間を描いています。</p>
<p>TALETONEは本作において、作曲・編曲・演奏・ボーカルガイド制作・ボーカルエディットなど、音楽制作全般を担当しました。</p>
<p>爽やかなメロディーとロックバンドサウンドに乗せて、不器用でありながらも輝いていた日々が、一冊の楽譜のように残ることを願い、心を込めて制作しました。</p>
<p>この素晴らしいプロジェクトに参加できたことを、心より感謝申し上げます。</p>
<p>『Heart Score』が、多くの方々の心に長く残る一曲となりますように。</p>
<p>A tale becomes a tone.<br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
</article>
