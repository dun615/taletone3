<h1>Works | TALETONE MUSIC — 制作実績</h1>
<p><strong>あなたの物語が、音楽になる場所。</strong></p>
<p>TALETONE MUSICの公開制作実績です。Heart Score、Drawing Summer、Love Dopamineなど、オリジナルソング、OST、キャラクターソング、BGMの制作記録を紹介します。</p>
<section>
<h2>制作実績</h2>
<ul>
<li><strong><a href="/ja/works/bubble-sweet/">Bubble Sweet</a></strong> — DOLONGCHA · DOLONGCHA 2nd Single (2026.07.11)<br>真夏の陽射しの下、泡のように弾ける甘いときめきを、ひんやりとした一杯に閉じ込めた物語。</li>
<li><strong><a href="/ja/works/heart-score/">Heart Score</a></strong> — STELLIVE Universe · STELLIVE『Universe』2nd Single (2026.06.11)<br>それぞれ異なる色を持つ4人の少女が一つのバンドとなり、自分たちだけの物語を紡いでいく物語。</li>
<li><strong><a href="/ja/works/love-novel/">Love Novel</a></strong> — Arune · 『Arune』1st Single (2026.03.08)<br>悲しみと恋しさを越え、もう一度愛を始める二人の物語。</li>
<li><strong><a href="/ja/works/fallen-leaves/">Fallen Leaves</a></strong> — Kurogami Sasha · V-llage『Kurogami Sasha』1st Single (2025.12.23)<br>「あの頃の自分」を終わらせるため、ロシアンルーレットを始めた一人の少女の物語。</li>
<li><strong><a href="/ja/works/gangchi-island-op/">Gangchi Island (OP)</a></strong> — SEION · アニメーション『Gangchi Island』1st OP（Produced by Jang Junho） (2025.09.10)<br>Gangchi Islandで夢と友情を育んでいく仲間たちの物語。</li>
<li><strong><a href="/ja/works/love-dopamine/">Love Dopamine</a></strong> — ヘボム (HAEBOM) · ヘボム (HAEBOM) 3rd Single (2025.08.30)<br>「好き」と伝えたい気持ちが、ドーパミンのように弾け出すヘボムの物語。</li>
<li><strong><a href="/ja/works/the-run-catch/">The Run Catch</a></strong> — DOLONGCHA · DOLONGCHA 1st Single (2025.08.23)<br>好きな人に向かって、迷わず駆け出す一人の少女（？）の物語。</li>
<li><strong><a href="/ja/works/drawing-summer/">Drawing Summer</a></strong> — ゼンレスゾーンゼロ · Zenless Zone Zero HoYoFair Album &quot;Random Play&quot; Anniversary (2025.07.06)<br>夏のバカンスへ出かけた「邪兎屋」の物語。</li>
<li><strong><a href="/ja/works/floris-waltz/">Floris Waltz</a></strong> — フローリス・ロエ (V-llage) · V-llage『Floris Loe』1st Single (2025.03.21)<br>不安と執着の感情を、物語性のある音楽で描いた作品。</li>
<li><strong><a href="/ja/works/early-spring/">Early Spring [ALBUM]</a></strong> — Dear my heroes · Dear my heroes 1st EP (2025.03.06)<br>死と別れの後に残された心が、時間と季節の巡りの中で悲しみを越え、再び生きていく物語です。</li>
<li><strong><a href="/ja/works/pompous/">Pompous</a></strong> — Beldir (V-LUP) · V-LUP『Beldir』1st Single (2025.01.27)<br>SNSの中の虚栄と承認欲求へ、まっすぐ叫ぶ物語です。</li>
<li><strong><a href="/ja/works/new-year-syndrome/">NEW YEAR SYNDROME</a></strong> — MAIMATSU · MAIMATSU 2nd Single (2024.12.27)<br>今年もきっと守れない新年の計画を立てる、四人の少女たちの物語です。</li>
<li><strong><a href="/ja/works/wrap-up/">Wrap Up</a></strong> — RoA · RoA 4th Single (2024.11.22)<br>終わった関係をきれいに整理し、前へ進む少女の物語です。</li>
<li><strong><a href="/ja/works/silverline/">SilverLine [ALBUM]</a></strong> — V-llage · SilverLine [ALBUM] (2024.07.16)<br>暗い雲に覆われた街へ、七人の少女たちが光を取り戻す物語です。</li>
<li><strong><a href="/ja/works/my-village/">My Village</a></strong> — V-llage · ゲーム『Welcome to V-llage!』主題歌 (2024.07.02)<br>V-llageという小さな村に集まったみんなで作っていく、あたたかな物語。</li>
<li><strong><a href="/ja/works/kanism-holic/">かにずむ☆ほりっく</a></strong> — ティグリス・カニン · V-llage『ティグリス・カニン』1st Single (2024.04.06)<br>酒場『ティグリス』に集まったみんなが笑い、語り合い、思い出を作っていく物語。</li>
<li><strong><a href="/ja/works/backstage/">BACKSTAGE</a></strong> — Mafhills · Mafhills 1st Single (2024.03.03)<br>ライブを前に、ファンと会えるその日だけを待つアーティストたちの高鳴る心を込めた物語です。</li>
<li><strong><a href="/ja/works/watercolour/">Watercolour</a></strong> — soraniwa · soraniwa Project 1st Single (2024.02.22)<br>忘れられた記憶のかけらを集め、失った友だちを探していく少女の物語です。</li>
<li><strong><a href="/ja/works/star-to-star/">STAR to STAR</a></strong> — Shabel Tonya · Honkai: Star Rail『2023 Multiverse Vistas』人気賞・優秀賞受賞作 (2023.06.30)<br>星と星をつなぐ旅の中で、運命に抗いながら開拓を続ける物語です。</li>
<li><strong><a href="/ja/works/night-sky/">Night Sky</a></strong> — Bed Taker · Bed Taker 1st Single (2021.11.19)<br>誰にも言えなかった痛みを夜空へ打ち明ける物語です。</li>
<li><strong><a href="/ja/works/sailing-stars/">Sailing StarS!</a></strong> — N4ML · 歌い手8人合唱プロジェクト (2019.10.06)<br>互いの手を取り合い、輝く明日へ進んでいく物語です。</li>
</ul>
</section>
