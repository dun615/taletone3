<h1>News | TALETONE MUSIC — 소식과 업데이트</h1>
<p><strong>당신의 이야기가 음악이 되는 곳</strong></p>
<p>TALETONE MUSIC(테일톤 뮤직)의 최신 소식, 프로젝트 업데이트, STELLIVE 마음악보 발매 소식 등을 모아둡니다.</p>
<article>
<h2>2026.07.11 · <a href="/news/bubble-sweet-release/">도롱챠 2nd Single &#39;Bubble Sweet&#39; 발매</a></h2>
<p>TALETONE이 음악 제작으로 함께한 버추얼 아티스트 도롱챠의 두 번째 오리지널 싱글 ‘Bubble Sweet’이 발매되었습니다.</p>
<p>햇살이 반짝이는 어느 여름날, 투명한 컵 안에서 작고 달콤한 이야기가 시작됩니다.</p>
<p>‘Bubble Sweet’은 버블티와 팝핑보바를 비롯한 다양한 카페 음료에서 영감을 받은 곡입니다. 알록달록한 음료 속을 여행하듯 흐르는 멜로디와 방울방울 피어오르는 설렘을 도롱챠만의 사랑스럽고 순수한 목소리로 그려냈습니다.</p>
<p>TALETONE은 이번 곡의 총괄 음악 프로듀싱을 비롯해 작사, 작곡, 편곡, 신시사이저, 드럼 프로그래밍과 베이스 기타 연주 등 음악 제작 전반에 참여했습니다.</p>
<p>통통 튀어 오르는 리듬과 중독성 있는 훅 위에 한 모금의 달콤함이 작은 행복으로 변하는 순간을 담았습니다. 버블처럼 몽글몽글 피어오른 마음이 음악을 따라 청량한 여름 하늘까지 닿을 수 있기를 바랐습니다.</p>
<p>소중하고 사랑스러운 이야기에 함께할 수 있어 진심으로 감사드립니다.  <br>‘Bubble Sweet’이 여러분의 여름에도 달콤한 마법 같은 순간으로 오래 남기를 바랍니다.</p>
<p>A tale becomes a tone.  <br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
</article>
<article>
<h2>2026.07.11 · <a href="/news/taletone-begins/">TALETONE, 첫 이야기를 시작합니다</a></h2>
<p>드디어 TALETONE이 첫걸음을 내디뎠습니다.</p>
<p>오래전부터 머릿속에만 있던 이야기와 음악, 그리고 우리가 만들고 싶은 세계를 하나의 이름 아래에 모으기까지 생각보다 많은 시간이 걸렸습니다.<br>그 과정이 쉽지만은 않았지만, 함께 고민하고 움직여준 사람들 덕분에 이렇게 시작을 알릴 수 있게 되었습니다.</p>
<p>TALETONE은 단순히 음악을 만드는 곳이 아니라,<br>이야기가 소리가 되고, 소리가 다시 누군가의 세계로 닿을 수 있도록 만들어가는 팀이 되고자 합니다.</p>
<p>함께해준 멤버들, 작업에 힘을 보태준 분들, 그리고 늘 응원해주시는 모든 분들께 진심으로 감사드립니다.<br>아직은 작은 출발이지만, 앞으로 더 좋은 음악과 이야기로 차근차근 보여드리겠습니다.</p>
<p>앞으로의 TALETONE도 잘 부탁드립니다.</p>
<p>A tale becomes a tone.<br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
</article>
<article>
<h2>2026.06.11 · <a href="/news/heart-score-release/">STELLIVE Universe ‘마음악보’ 발매</a></h2>
<p>TALETONE이 음악 제작으로 함께한 STELLIVE Universe의 단체 오리지널 싱글 ‘마음악보’가 발매되었습니다.</p>
<p>‘마음악보’는 스텔라이브 2기생 유닛 &#39;Universe&#39; 소속 아티스트<br>&#39;시라유키 히나&#39;, &#39;네네코 마시로&#39;, &#39;아카네 리제&#39;, &#39;아라하시 타비&#39;가 함께한 곡으로, ‘청춘’이라는 테마 아래 시간과 추억이 노래 안에 새겨지는 순간을 그려냅니다.</p>
<p>TALETONE은 이번 곡에서 작곡, 편곡, 연주, 보컬 가이드 및 보컬 에디팅 등 음악 제작 전반에 참여했습니다.<br>청량한 멜로디와 록 밴드 사운드 위에, 서툴지만 눈부셨던 순간들이 하나의 악보처럼 남을 수 있도록 마음을 담았습니다.</p>
<p>소중한 프로젝트에 함께할 수 있어 진심으로 감사드립니다.<br>‘마음악보’가 많은 분들의 마음속에도 오래 남는 노래가 되기를 바랍니다.</p>
<p>A tale becomes a tone.<br>A tone becomes music.</p>
<p>TALETONE MUSIC</p>
</article>
