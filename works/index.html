<h1>Works | TALETONE MUSIC — 공개 작업물 포트폴리오</h1>
<p><strong>당신의 이야기가 음악이 되는 곳</strong></p>
<p>TALETONE MUSIC(테일톤 뮤직)의 공개 작업물 포트폴리오입니다. 마음악보, 여름을 그리다, Love Dopamine 등 오리지널송, OST, 캐릭터송, BGM 제작 기록을 소개합니다.</p>
<section>
<h2>작업물</h2>
<ul>
<li><strong><a href="/works/bubble-sweet/">Bubble Sweet</a></strong> — DOLONGCHA · DOLONGCHA 2nd Single (2026.07.11)<br>한여름 햇살 아래, 버블처럼 톡톡 터지는 달콤한 설렘을 시원한 한 잔에 담아낸 이야기.</li>
<li><strong><a href="/works/heart-score/">마음악보</a></strong> — STELLIVE Universe · STELLIVE &#39;Universe&#39; 2nd Single (2026.06.11)<br>서로 다른 색을 가진 네 소녀가 하나의 밴드가 되어, 자신들만의 이야기를 써 내려가는 이야기.</li>
<li><strong><a href="/works/love-novel/">Love Novel</a></strong> — Arune · &#39;Arune&#39; 1st Single (2026.03.08)<br>슬픔과 그리움을 지나 다시 사랑을 시작하게 되는 두 사람의 이야기.</li>
<li><strong><a href="/works/fallen-leaves/">Fallen Leaves</a></strong> — 쿠로가미 사샤 · V-llage &#39;쿠로가미 사샤&#39; 1st Single (2025.12.23)<br>&#39;그때의 나&#39;를 끝내기 위해 러시안 룰렛을 시작한 한 소녀의 이야기</li>
<li><strong><a href="/works/gangchi-island-op/">강치 아일랜드(OP)</a></strong> — SEION · ANIMATION &#39;강치 아일랜드&#39; 1st OP (Prod by 장준호) (2025.09.10)<br>강치 아일랜드에서 꿈과 우정을 키워가는 친구들의 이야기</li>
<li><strong><a href="/works/love-dopamine/">Love Dopamine</a></strong> — 해봄 · &#39;해봄&#39; 3rd Single (2025.08.30)<br>좋아한다고 말하고 싶은 마음이 도파민처럼 터져버린 &#39;해봄&#39;의 이야기</li>
<li><strong><a href="/works/the-run-catch/">The Run Catch</a></strong> — DOLONGCHA · DOLONGCHA(도롱챠) 1st Single (2025.08.23)<br>좋아하는 사람을 향해 망설임 없이 달려가는 한 소녀(?) 이야기</li>
<li><strong><a href="/works/drawing-summer/">여름을 그리다</a></strong> — 젠레스 존 제로 · 게임 Zenless Zone Zero HoYoFair Album &quot;Random Play&quot; Anniversary (2025.07.06)<br>여름 바캉스를 가게 된 &#39;교활한 토끼굴&#39;의 이야기</li>
<li><strong><a href="/works/floris-waltz/">Floris Waltz</a></strong> — 플로리스 로에 (V-llage) · V-llage &#39;플로리스 로에&#39; 1st Single (2025.03.21)<br>불안과 집착의 감정선을 서사적 음악으로 풀어낸 작업.</li>
<li><strong><a href="/works/early-spring/">Early Spring [ALBUM]</a></strong> — Dear my heroes · Dear my heroes 1st EP (2025.03.06)<br>죽음과 이별 이후, 남겨진 마음들이 시간과 계절의 순환 속에서 슬픔을 지나 다시 살아가는 이야기</li>
<li><strong><a href="/works/pompous/">Pompous</a></strong> — 벨디르 미스틸테인 (V-LUP) · V-LUP &#39;Beldir&#39; 1st Single (2025.01.27)<br>SNS 속 허영과 인정욕구를 향해 거침없이 외치는 이야기</li>
<li><strong><a href="/works/new-year-syndrome/">새해결심 작심삼일</a></strong> — MAIMATSU · MAIMATSU 2nd Single (2024.12.27)<br>올해도 지켜지지 않을 신년 계획을 세운 네 소녀의 이야기</li>
<li><strong><a href="/works/wrap-up/">Wrap Up</a></strong> — RoA · RoA 4th Single (2024.11.22)<br>끝난 관계를 깔끔하게 정리하고 앞으로 나아가는 한 소녀의 이야기</li>
<li><strong><a href="/works/silverline/">SilverLine [ALBUM]</a></strong> — V-llage · SilverLine [ALBUM] (2024.07.16)<br>먹구름에 가려진 도시에 빛을 되찾아 주는 일곱 소녀의 이야기</li>
<li><strong><a href="/works/my-village/">My Village</a></strong> — V-llage · 게임 &#39;브이리지에 어서오세요!&#39; 주제곡 (2024.07.02)<br>브이리지라는 작은 마을에 모인 모두가 함께 만들어가는 따뜻한 이야기</li>
<li><strong><a href="/works/kanism-holic/">카니즘☆홀릭</a></strong> — 티그리스 카닌 · V-llage &#39;티그리스 카닌&#39; 1st Single (2024.04.06)<br>술집 &#39;티그리스&#39;에 모인 모두가 함께 웃고 떠들며 추억을 만들어가는 이야기</li>
<li><strong><a href="/works/backstage/">BACKSTAGE</a></strong> — Mafhills · Mafhills 1st Single (2024.03.03)<br>라이브를 앞두고 팬들과 만날 그 날만을 기다리는 아티스트들의 두근거리는 마음을 담은 이야기</li>
<li><strong><a href="/works/watercolour/">수채화 (Watercolour)</a></strong> — soraniwa · soraniwa Project 1st Single (2024.02.22)<br>잊힌 기억의 조각을 모아, 잃어버린 친구를 찾아가는 한 소녀의 이야기</li>
<li><strong><a href="/works/star-to-star/">STAR to STAR</a></strong> — Shabel Tonya · 붕괴 스타레일 &#39;2023 Multiverse Vistas&#39; 인기, 우수상 수상작 (2023.06.30)<br>별과 별을 잇는 여정 속에서 운명에 맞서 개척을 이어가는 이야기</li>
<li><strong><a href="/works/night-sky/">밤하늘</a></strong> — 침대점령 · 침대점령(Bed Taker) 1st Single (2021.11.19)<br>아무에게도 말하지 못한 아픔을 밤하늘에 털어놓는 이야기</li>
<li><strong><a href="/works/sailing-stars/">Sailing StarS!</a></strong> — N4ML · 우타이테 8인 합창 프로젝트 (2019.10.06)<br>서로의 손을 잡고 빛나는 내일을 향해 나아가는 이야기</li>
</ul>
</section>
