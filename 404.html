<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#fefefe">
  <title>Page not found | TALETONE MUSIC</title>
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <script>
    // The retired addresses still out there (the old work pages, their /works/ aliases, the news) lead to where that
    // now lives: a work opens at /discography/?work=<slug> (an address the site does not know just opens the
    // discography). The status stays 404, so search engines let the old address go.
    (function () {
      var m = location.pathname.match(/^\/(en\/|ja\/)?(discography|works|news)\/([a-z0-9-]+)\/?/), news = { 'bubble-sweet-release': 'bubble-sweet', 'heart-score-release': 'heart-score' };
      if (!m) return;
      var pre = m[1] ? '/' + m[1].slice(0, 2) : '', slug = m[2] === 'news' ? news[m[3]] : m[3];
      location.replace(slug ? pre + '/discography/?work=' + slug : pre + '/about/');
    })();
  </script>
  <style>
    @font-face { font-family: NanumSquareRound; font-weight: 400; font-display: swap; src: url(/assets/fonts/nanum-square-round-400.woff2) format("woff2"); }
    @font-face { font-family: NanumSquareRound; font-weight: 700; font-display: swap; src: url(/assets/fonts/nanum-square-round-700.woff2) format("woff2"); }
    @font-face { font-family: Manjari; font-weight: 700; font-display: swap; src: url(/assets/fonts/manjari-700.woff2) format("woff2"); }
    :root { --tt-canvas: #fefefe; --tt-canvas-shade: #e5e6e8; --tt-ink: #141c30; --tt-ink-muted: #5b606c; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid; min-height: 100vh; place-items: center;
      padding: 32px max(22px, env(safe-area-inset-right, 0px)) 32px max(22px, env(safe-area-inset-left, 0px));
      color: var(--tt-ink); background: var(--tt-canvas);
      font-family: NanumSquareRound, Manjari, system-ui, sans-serif; word-break: keep-all;
    }
    main { width: min(720px, 100%); }
    .brand { display: inline-flex; }
    .brand img { display: block; height: 26px; width: auto; }
    .code { margin: 56px 0 12px; color: var(--tt-ink-muted); font-family: Manjari, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .22em; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 48px); line-height: 1.3; font-weight: 700; }
    p { max-width: 560px; margin: 18px 0 0; color: var(--tt-ink-muted); font-size: clamp(16px, 2vw, 18px); line-height: 1.75; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
    nav a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 20px; border: 1px solid var(--tt-ink); border-radius: 999px; color: var(--tt-ink); font-weight: 700; font-size: 15px; text-decoration: none; }
    nav a:first-child { background: var(--tt-ink); color: var(--tt-canvas); }
    a:focus-visible { outline: 2px solid var(--tt-ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/assets/logo/lockup-line-ink.svg" alt="TALETONE MUSIC"></a>
    <div class="code">404</div>
    <h1>이 주소에는 이야기가 없습니다.</h1>
    <p>주소가 바뀌었거나 없는 페이지입니다. 아래에서 다시 시작하실 수 있습니다.<br><span lang="en">This page could not be found.</span> <span lang="ja">ページが見つかりません。</span></p>
    <nav aria-label="주요 페이지">
      <a href="/">홈 · Home</a>
      <a href="/discography/">디스코그래피 · Discography</a>
      <a href="/contact/">문의 · Contact</a>
      <a href="/en/" lang="en">English</a>
      <a href="/ja/" lang="ja">日本語</a>
    </nav>
  </main>
</body>
</html>
