<p><strong>당신의 이야기가 음악이 되는 곳</strong></p>
<p>TALETONE MUSIC(테일톤 뮤직)은 서브컬처 게임, 버튜버, 애니메이션 등 세계관이 있는 IP의 오리지널송, OST, 캐릭터송, BGM을 기획·제작하는 스토리 기반 음악 프로덕션입니다.</p>
<section>
<h2>어떤 이야기와 일하는가</h2>

<p>게임부터 버추얼 아티스트, 애니메이션까지. 이야기의 감정과 캐릭터를 읽어 음악의 방향을 설계합니다.</p>
</section>
